# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Application Name
# ===============================
spring.application.name=taskflow-backend
spring.flyway.enabled=false
# ===============================
# Database (Postgres)
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Atharva@2002}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
# CAUTION: 'update' is risky in prod, but requested.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Redis (Cache)
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ===============================
# Kafka (Eventing)
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

# Security & SASL Config
spring.kafka.properties.security.protocol=${KAFKA_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}

# Consumer Config
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:taskflow-backend-group}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer Config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===============================
# Custom App Configuration
# ===============================
# JWT Config
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForSigningJWTsMustBeLongEnough}
app.jwt.expiration-ms=3600000

# CORS Config
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}